{% extends "base.html" %}
{% block title %}Nuevo producto | Botica Salud & Vida{% endblock %}
{% block content %}<section class="card"><h2>Registrar producto</h2><form method="post">
<label>Nombre <input name="nombre" required maxlength="120"></label>
<label>Descripción <textarea name="descripcion" rows="3"></textarea></label>
<label>Categoría <select name="categoria_id" required>{% for categoria in categorias %}<option value="{{ categoria.id }}">{{ categoria.nombre }}</option>{% endfor %}</select></label>
<label>Precio <input name="precio" type="number" min="0" step="0.01" required></label>
<label>Stock mínimo <input name="stock_minimo" type="number" min="0" required></label>
<button>Guardar producto</button></form></section>{% endblock %}

{% extends "base.html" %}
{% block title %}Nueva categoría | Botica Salud & Vida{% endblock %}
{% block content %}
<section class="card">
    <h2>Registrar categoría</h2>
    <form method="post">
        <label>Nombre
            <input name="nombre" maxlength="80" required value="{{ request.form.get('nombre', '') }}">
        </label>
        <label>Descripción
            <textarea name="descripcion" rows="4" maxlength="250">{{ request.form.get('descripcion', '') }}</textarea>
        </label>
        <div class="acciones-formulario">
            <button type="submit">Guardar categoría</button>
            <a class="boton secundario" href="{{ url_for('categorias.index') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Botica Salud & Vida{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <header>
    <h1>Botica Salud & Vida</h1>
    <nav>
      <a href="{{ url_for('dashboard.index') }}">Inicio</a>
      <a href="{{ url_for('productos.index') }}">Productos</a>
      <a href="{{ url_for('categorias.index') }}">Categorías</a>
      <a href="{{ url_for('inventario.index') }}">Inventario</a>
      <a href="{{ url_for('alertas.index') }}">Alertas</a>
      <a href="{{ url_for('reportes.index') }}">Reportes</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% with mensajes = get_flashed_messages(with_categories=true) %}
    {% if mensajes %}
      <aside class="mensajes" aria-live="polite">
        {% for categoria, mensaje in mensajes %}
          <p class="mensaje {{ categoria }}">{{ mensaje }}</p>
        {% endfor %}
      </aside>
    {% endif %}
  {% endwith %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
